[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ent-rag-foundation"
version = "1.0.0"
description = "Offline synthetic M0 LangGraph RAG foundation"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "langgraph>=1,<2", "pydantic>=2,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
retrieval = ["numpy==2.5.1", "onnxruntime==1.28.0", "tokenizers==0.23.1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q --basetemp=.test-tmp"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
