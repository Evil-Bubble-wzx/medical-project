<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机资料导入</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/audit.css"><script defer src="/assets/imports.js"></script></head><body><header><div class="brand">ENT Studio · 导入资料文件</div><nav><a href="/local">本机入口</a><a href="/doctor">咨询</a><a href="/audit">版本管理</a></nav></header><main class="audit-main"><h1>导入资料并准备检索</h1><p>支持文字版PDF、Word（.docx）、UTF-8 TXT/Markdown或粘贴原文。PDF按页、Word按段落或表格单元格定位；先检查提取结果再准备索引。扫描件需先OCR，旧版.doc及网页自动抓取暂不支持。</p><p id="import-message" role="status" aria-live="polite"></p><form id="import-form" class="audit-panel"><label>标题<input id="import-title" maxlength="200" required></label><label>原始来源链接<input id="import-url" type="url" required placeholder="https://..."></label><label>主题<select id="import-topic"><option value="rhinitis">鼻炎</option><option value="sinusitis">鼻窦炎</option><option value="otitis_media">中耳炎</option><option value="hearing_loss">听力损失</option><option value="tinnitus">耳鸣</option><option value="throat">咽喉</option></select></label><label>复用许可依据<input id="import-license" minlength="5" maxlength="500" required placeholder="填写许可名称、授权或允许复用的依据"></label><label>选择资料文件（PDF/DOCX不超过8MB）<input id="import-file" type="file" accept=".pdf,.docx,.txt,.md"></label><button id="import-clear-file" type="button" class="audit-secondary">清除文件，改用粘贴文字</button><section id="import-preview" hidden><h3>提取预览与定位</h3><p id="import-preview-summary"></p><ul id="import-warnings"></ul><div id="import-units"></div><label><input id="import-extraction-confirmed" type="checkbox" disabled>我已对照原文件检查提取顺序、缺失内容及表格，确认本次提取文字可用于开发检索</label></section><label>资料文字（文件提取结果只读；粘贴文字30—30000字）<textarea id="import-text" rows="12" minlength="30" maxlength="30000" required></textarea></label><label>操作人<input id="import-actor" maxlength="200" required></label><label>操作原因<input id="import-note" maxlength="1000" required></label><p><label><input id="import-adult" type="checkbox" required>已核对本次文字适用于18岁以上成人范围</label></p><p><label><input id="import-rights" type="checkbox" required>已核对本机保存与使用这些文字的许可</label></p><p><label><input id="import-dev" type="checkbox" required>仅用于开发资料库，未经医学审核</label></p><button class="audit-primary" id="import-prepare" type="submit">保存原文并准备索引</button></form><section class="audit-panel"><h2>准备结果</h2><p id="import-result">尚未准备。完成索引前当前问答库保持不变。</p><button id="import-activate" class="audit-primary" type="button" disabled>启用已准备资料</button><p>仅准备不会影响问答。启用成功后新咨询使用新快照，旧历史和引用保留。需要撤回或回滚时前往资料版本管理。</p></section></main></body></html>
